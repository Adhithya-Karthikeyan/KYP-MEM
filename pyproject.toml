[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyp-mem"
version = "1.2.0"
description = "Know Your Project — Persistent knowledge base for AI agents. MCP-powered with wikilinks, backlinks, auto-learning, and neon web UI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Adhithya Karthikeyan", email = "skadhithya95@gmail.com"}
]
keywords = ["knowledge-base", "markdown", "ai", "mcp", "notes", "wiki", "second-brain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
# mcp is pinned below 2: mcp 2.0.0 (2026-07-28) removed the
# mcp.server.fastmcp.FastMCP import path this server is built on. v1.x is the
# maintainers' supported maintenance line; migrate deliberately, not by
# accident of an unbounded pin.
dependencies = [
    "mcp>=1.28,<2",
    "pyyaml>=6.0",
]

# The base install is deliberately tiny (~30 MB): MCP server, vault, BM25
# keyword search, and hooks all work with no extras. Anything heavier is
# opt-in. The npm installer provisions [ui,vector] by default, so npm users
# keep the batteries-included experience; PyPI/uvx users choose their tier.
[project.optional-dependencies]
# Local web UI (kyp-mem ui).
ui = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
# Semantic search: SQLite + numpy vector store, embeddings via ONNX
# all-MiniLM-L6-v2 (the exact model the old ChromaDB backend bundled, so
# retrieval quality is unchanged). No torch.
vector = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]
# Numpy-only static embeddings (model2vec) — smallest possible semantic
# tier. Opt in with: kyp-mem config embedding_model static. Measurably
# weaker floors than the default; see kyp_mem/embedder.py.
vector-lite = [
    "numpy>=1.24",
    "model2vec>=0.6",
]
# Full sentence-transformers models (pulls torch — heavy).
st = [
    "sentence-transformers>=3.0",
]
all = [
    "kyp-mem[ui,vector]",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Adhithya-Karthikeyan/KYP-MEM"
Repository = "https://github.com/Adhithya-Karthikeyan/KYP-MEM"
Issues = "https://github.com/Adhithya-Karthikeyan/KYP-MEM/issues"

[project.scripts]
kyp-mem = "kyp_mem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kyp_mem"]

[tool.hatch.build.targets.sdist]
# Explicit allow-list. The default sdist sweeps the whole working tree, which
# shipped 145 .omc/ agent-state files containing personal absolute paths.
include = [
    "kyp_mem",
    "pyproject.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
# Must match requires-python. Without this, ruff assumes the interpreter it is
# running under (3.14 here) and silently accepts syntax that fails on 3.10 —
# which is how a nested same-quote f-string in server.py shipped in a package
# declaring 3.10 support, making the MCP server unimportable there.
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that build a real vector store with real embeddings",
]
