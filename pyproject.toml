[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyp-mem"
version = "0.9.0"
description = "Know Your Project — Persistent knowledge base for AI agents. MCP-powered with wikilinks, backlinks, auto-learning, and neon web UI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Adhithya Karthikeyan", email = "skadhithya95@gmail.com"}
]
keywords = ["knowledge-base", "markdown", "ai", "mcp", "notes", "wiki", "second-brain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/kdbalagency/kyp-mem"
Repository = "https://github.com/kdbalagency/kyp-mem"
Issues = "https://github.com/kdbalagency/kyp-mem/issues"

[project.scripts]
kyp-mem = "kyp_mem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kyp_mem"]

[tool.ruff]
# Must match requires-python. Without this, ruff assumes the interpreter it is
# running under (3.14 here) and silently accepts syntax that fails on 3.10 —
# which is how a nested same-quote f-string in server.py shipped in a package
# declaring 3.10 support, making the MCP server unimportable there.
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that build a real ChromaDB store",
]
